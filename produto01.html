<h1>Produto 01 - Dinâmica da Soja</h1>

<p>
O Produto 01 analisa a distribuição da soja nos municípios avaliados pelo
Atlas Reverte, permitindo identificar áreas consolidadas de produção,
municípios com maior crescimento recente e territórios associados à expansão
agrícola observada entre 2015 e 2025.
</p>

<p>
As informações abaixo são carregadas automaticamente a partir da base
<b>area_soja.csv</b>.
</p>

<div class="cards">

    <div class="card">
        <h3>Municípios Analisados</h3>
        <p id="nMunicipios">-</p>
    </div>

    <div class="card">
        <h3>Área Total de Soja (2025)</h3>
        <p id="areaTotal">-</p>
    </div>

    <div class="card">
        <h3>Maior Área de Soja</h3>
        <p id="liderArea">-</p>
    </div>

    <div class="card">
        <h3>Maior Expansão (10 anos)</h3>
        <p id="liderExpansao">-</p>
    </div>

</div>

<hr>

<h2>Perguntas Respondidas</h2>

<ul>
<li>Onde está concentrada a soja?</li>
<li>Quais municípios possuem maior área cultivada?</li>
<li>Onde ocorreu maior crescimento da soja?</li>
<li>Quais municípios participam do Programa Reverte?</li>
<li>Qual a magnitude da expansão observada nos últimos 5 e 10 anos?</li>
</ul>

<hr>

<h2>Consulta Municipal</h2>

<input
    type="text"
    id="busca"
    placeholder="Pesquisar município..."
>

<table>

<thead>

<tr>

<th>Município</th>
<th>UF</th>
<th>Área Soja 2025 (ha)</th>
<th>Área Soja 2020 (ha)</th>
<th>Área Soja 2015 (ha)</th>
<th>Expansão 10 anos</th>
<th>Expansão 5 anos</th>
<th>Reverte</th>

</tr>

</thead>

<tbody id="tabela">

</tbody>

</table>

<script>

let dadosOriginais = [];

function paraNumero(valor){

    if(valor === null || valor === undefined){
        return 0;
    }

    return parseFloat(
        String(valor)
            .replace(/\./g,"")
            .replace(",",".")
    );

}

function paraPercentual(valor){

    return parseFloat(
        String(valor).replace("%","")
    );

}

function preencherTabela(lista){

    let html = "";

    lista.forEach(function(row){

        html += `
        <tr>
            <td>${row.Munic}</td>
            <td>${row.UF}</td>
            <td>${row.Area_Soja_ha_2025}</td>
            <td>${row.Area_Soja_ha_2020}</td>
            <td>${row.Area_Soja_ha_2015}</td>
            <td>${row.Expansao_10_anos}</td>
            <td>${row.Expansao_5_anos}</td>
            <td>${row.Mun_Rev}</td>
        </tr>
        `;

    });

    document.getElementById("tabela").innerHTML = html;

}

Papa.parse("dados/area_soja.csv",{

    download:true,
    header:true,

    complete:function(resultado){

        dadosOriginais = resultado.data.filter(
            x => x.Munic && x.Munic.trim() !== ""
        );

        preencherTabela(dadosOriginais);

        document.getElementById("nMunicipios").innerHTML =
            dadosOriginais.length;

        let areaTotal = dadosOriginais.reduce(function(total,row){

            return total +
                paraNumero(row.Area_Soja_ha_2025);

        },0);

        document.getElementById("areaTotal").innerHTML =
            areaTotal.toLocaleString(
                "pt-BR",
                {
                    minimumFractionDigits:0,
                    maximumFractionDigits:0
                }
            ) + " ha";

        let liderArea = [...dadosOriginais]
        .sort(function(a,b){

            return paraNumero(b.Area_Soja_ha_2025) -
                   paraNumero(a.Area_Soja_ha_2025);

        })[0];

        document.getElementById("liderArea").innerHTML =
            liderArea.Munic +
            " (" + liderArea.UF + ")";

        let liderExpansao = [...dadosOriginais]
        .sort(function(a,b){

            return paraPercentual(b.Expansao_10_anos) -
                   paraPercentual(a.Expansao_10_anos);

        })[0];

        document.getElementById("liderExpansao").innerHTML =
            liderExpansao.Munic +
            " (" + liderExpansao.Expansao_10_anos + ")";

    }

});

document
.getElementById("busca")
.addEventListener("keyup", function(){

    let texto = this.value.toLowerCase();

    let filtrado = dadosOriginais.filter(function(row){

        return row.Munic
            .toLowerCase()
            .includes(texto);

    });

    preencherTabela(filtrado);

});

</script>
